<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ferrari · 透明动效预览</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#12151b;color:#eef0f4;font:15px system-ui}main{display:flex;justify-content:center;gap:32px;align-items:flex-start}.stage{width:375px;height:812px;max-width:90vw;aspect-ratio:750/1624;position:relative;background-color:#20242c;background-image:linear-gradient(45deg,#292e37 25%,transparent 25%),linear-gradient(-45deg,#292e37 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#292e37 75%),linear-gradient(-45deg,transparent 75%,#292e37 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;border:1px solid #3b424e;border-radius:14px;overflow:hidden}#car{width:100%;height:100%}aside{max-width:320px;padding-top:24px}h1{font-size:23px;font-weight:600}p{color:#aeb7c6;line-height:1.7}button{border:1px solid #526071;background:#252e3b;color:white;padding:10px 15px;border-radius:8px;cursor:pointer;margin:0 6px 8px 0}input{width:100%;margin:20px 0}output{display:block;font-variant-numeric:tabular-nums;color:#c2cad7}#status{font-size:13px}@media(max-width:700px){main{flex-direction:column;align-items:center}.stage{height:auto}aside{padding-top:0;width:100%}}
</style><main><div class="stage" id="stage"><div id="car"></div></div><aside><h1>Ferrari V3 · 漂移动效</h1><p>750 × 1624 · 60 FPS · 5 秒<br>背景切换仅用于检查透明效果。</p><button id="play">播放</button><button id="pause">暂停</button><button id="restart">重播</button><input id="scrub" aria-label="动画帧" type="range" min="0" max="299" value="0"><output id="time">0.00 s / 5.00 s</output><p>透明背景检查</p><button data-bg="checker">棋盘格</button><button data-bg="#f5f5f5">浅色</button><button data-bg="#10131a">深色</button><p id="status">正在读取 SVGA…</p></aside></main>
<script src="svga.min.js"></script><script>
const player=new SVGA.Player('#car'),parser=new SVGA.Parser('#car');window.player=player;window.loaded=false;player.setContentMode('AspectFit');player.loops=0;
let url=new URLSearchParams(location.search).get('file')||'Ferrari_Drift_V3_750x1624_60fps.svga';
parser.load(url,data=>{window.svgaData=data;player.setVideoItem(data);window.loaded=true;document.querySelector('#status').textContent='已加载 · RGBA 透明图像';player.startAnimation()},err=>{document.querySelector('#status').textContent='读取失败，请通过本地 HTTP 服务打开此页面。';console.error(err)});
const scrub=document.querySelector('#scrub'),time=document.querySelector('#time');
player.onFrame(f=>{scrub.value=f;time.textContent=(f/60).toFixed(2)+' s / 5.00 s'});
document.querySelector('#play').onclick=()=>player.startAnimation();document.querySelector('#pause').onclick=()=>player.pauseAnimation();document.querySelector('#restart').onclick=()=>{player.stopAnimation();player.startAnimation()};scrub.oninput=()=>{player.stepToFrame(+scrub.value,false);time.textContent=(+scrub.value/60).toFixed(2)+' s / 5.00 s'};
document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{let s=document.querySelector('#stage');if(b.dataset.bg==='checker'){s.style.backgroundColor='';s.style.backgroundImage=''}else{s.style.backgroundColor=b.dataset.bg;s.style.backgroundImage='none'}});
</script></html>
